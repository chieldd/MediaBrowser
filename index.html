<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Browser</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1 class="header">Media Browser</h1>
    <div class="streaming-section">
      <h2>Streaming Services</h2>
      <div class="streaming-tiles">
        <a class="tile service-tile" href="https://www.netflix.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix" class="service-logo">
          <span>Netflix</span>
        </a>
        <a class="tile service-tile" href="https://www.hbomax.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/HBO_Max_Logo.svg" alt="HBO Max" class="service-logo">
          <span>HBO Max</span>
        </a>
        <a class="tile service-tile" href="https://www.youtube.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="YouTube" class="service-logo">
          <span>YouTube</span>
        </a>
        <a class="tile service-tile" href="https://www.disneyplus.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Disney+" class="service-logo">
          <span>Disney+</span>
        </a>
        <a class="tile service-tile" href="https://www.primevideo.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg" alt="Prime Video" class="service-logo">
          <span>Prime Video</span>
        </a>
        <a class="tile service-tile" href="https://www.spotify.com" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify" class="service-logo">
          <span>Spotify</span>
        </a>
        <div class="tile service-tile" id="local-videos-tile" tabindex="0" role="button">
          <img src="img/local.png" alt="Local Videos" class="service-logo">
          <span>Local Videos</span>
        </div>
      </div>
    </div>
    <div class="local-section" style="display:none;">
      <h2>Local Videos</h2>
      <div class="local-tiles" id="video-grid"></div>
      <div id="video-modal" class="modal hidden">
        <div class="video-modal-content">
          <button id="close-video" class="close-video">&times;</button>
          <video id="video-player" controls width="800" style="max-width:100%;">
            <source id="video-source" src="" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <div id="video-title" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Fetch and display local videos (shows and movies)
    function loadVideos() {
      fetch('/api/shows')
        .then(res => res.json())
        .then(data => {
          const grid = document.getElementById('video-grid');
          grid.innerHTML = '';
          // TV Shows (folders)
          data.shows.forEach(show => {
            const tile = document.createElement('div');
            tile.className = 'movie-tile';
            // Fetch show info from the shows table
            fetch(`/api/showinfo?folder=${encodeURIComponent(show.folder)}`)
              .then(res => res.json())
              .then(meta => {
                tile.innerHTML = '';
                if (meta.poster) {
                  const img = document.createElement('img');
                  img.src = meta.poster;
                  img.alt = meta.title || show.title;
                  img.className = 'movie-poster';
                  tile.appendChild(img);
                }
              })
              .catch(() => {
                tile.innerHTML = '';
              });
            tile.onclick = () => {
              window.location.href = `episodes.html?show=${encodeURIComponent(show.folder)}`;
            };
            grid.appendChild(tile);
          });
          // Top-level movies
          data.movies.forEach(movie => {
            const tile = document.createElement('div');
            tile.className = 'movie-tile';
            fetch(`/api/metadata?file=${encodeURIComponent(movie.filename)}`)
              .then(res => res.json())
              .then(meta => {
                tile.innerHTML = '';
                if (meta.thumbnail) {
                  const img = document.createElement('img');
                  img.src = meta.thumbnail;
                  img.alt = meta.title || movie.title;
                  img.className = 'movie-poster';
                  tile.appendChild(img);
                }
              })
              .catch(() => {
                tile.innerHTML = '';
              });
            tile.onclick = () => {
              window.location.href = `video.html?file=${encodeURIComponent(movie.filename)}`;
            };
            grid.appendChild(tile);
          });
        });
    }

    document.getElementById('local-videos-tile').onclick = function() {
      const localSection = document.querySelector('.local-section');
      if (localSection.style.display === 'none' || localSection.style.display === '') {
        localSection.style.display = 'block';
      } else {
        localSection.style.display = 'none';
      }
    };

    window.onload = loadVideos;
  </script>
</body>
</html>
